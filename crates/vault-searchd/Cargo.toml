[package]
name = "vault-searchd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Long-lived vault index and loopback embedding client"

[[bin]]
name = "vault-searchd"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
vault-search = { path = "../vault-search" }
vault-rclone = { path = "../vault-rclone" }

[dev-dependencies]
tempfile = "3"
