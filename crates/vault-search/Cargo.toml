[package]
name = "vault-search"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Chunk, index, and cosine-search Obsidian notes from caller-supplied vectors"

[dev-dependencies]
tempfile = "3"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
